server.port=8766
logging.level.root=DEBUG
logging.level.org.springframework=DEBUG
server.ssl.enabled=true
server.ssl.key-store=/home/ubuntu/ssl/gateway.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=gateway

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=test
spring.cloud.gateway.server.webflux.routes[0].uri=lb://eclient
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/test
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
#spring.cloud.gateway.server.webflux.routes[1].id=genocide-rest-proxy
#spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8090
#spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/eclient/genocide/**
#spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1 

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

